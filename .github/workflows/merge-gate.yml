name: merge-gate
# Engine-Gate (NUPORE): validiert die Engine ueber die synthetischen Fixtures.
# NUPORE haelt keinen Inhalt-`graph/`, daher pytest-only (kein `check.sh graph`).
on:
  pull_request:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhaengigkeiten
        run: pip install pyyaml pytest
      - name: Tests (Engine ueber synthetische Fixtures)
        run: python -m pytest
